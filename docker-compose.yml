version: '3.8'

services:
  backend:
    build: ./backend
    container_name: ai_study_notes_backend
    ports:
      - "8000:8000"
    env_file:
    - ./backend/.env
    volumes:
      - ./backend:/app
      - ./uploads:/app/uploads
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: ai_study_notes_frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    restart: unless-stopped

